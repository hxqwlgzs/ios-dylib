name: ${{ github.event.client_payload.buildRef }}
on:
  repository_dispatch:
    types: [build-plugin]
permissions: {}
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 校验并编译交付源码包
        env:
          PACKAGE_URL: ${{ github.event.client_payload.params.source_package.url }}
          PACKAGE_SHA: ${{ github.event.client_payload.params.source_package.sha256 }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_URL" == https://* && "$PACKAGE_SHA" =~ ^[a-f0-9]{64}$ ]]
          printf '::add-mask::%s\n' "$PACKAGE_URL"
          curl --proto '=https' --fail --silent --max-time 120 -o source.zip "$PACKAGE_URL"
          printf '%s  source.zip\n' "$PACKAGE_SHA" | shasum -a 256 -c -
          unzip -q source.zip -d source
          root=source/YZPlusAuthorizationSource
          variant=$(jq -er '.mode | if . == "card_unlock" or . == "device_authorization" then . else error("Unsupported mode") end' "$root/source-config.json")
          bash "$root/$variant/build.sh"
          mkdir -p out
          cp "$root/$variant/build/iphoneos-arm64/"*.dylib out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.artifactPrefix }}-${{ github.run_id }}
          path: out/*.dylib
          if-no-files-found: error
          retention-days: 7
