name: YZPlus Build
run-name: ${{ inputs.buildRef || github.event.client_payload.buildRef || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      buildRef:
        description: 构建任务号
        required: true
        type: string
      artifactPrefix:
        description: 产物前缀
        required: false
        type: string
      params:
        description: 构建参数 JSON
        required: true
        type: string
  repository_dispatch:
    types: [build-plugin]
permissions: {}
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 校验并编译交付源码包
        env:
          PARAMS_JSON: ${{ inputs.params || toJSON(github.event.client_payload.params) }}
        run: |
          set -euo pipefail
          echo "$PARAMS_JSON" > params.json
          PACKAGE_URL=$(jq -er '.authorization_source.url' params.json)
          PACKAGE_SHA=$(jq -er '.authorization_source.sha256' params.json)
          [[ "$PACKAGE_URL" == https://* && "$PACKAGE_SHA" =~ ^[a-f0-9]{64}$ ]]
          printf '::add-mask::%s\n' "$PACKAGE_URL"
          curl --proto '=https' --fail --silent --max-time 120 -o source.zip "$PACKAGE_URL"
          printf '%s  source.zip\n' "$PACKAGE_SHA" | shasum -a 256 -c -
          unzip -q source.zip -d source
          root=source/YZPlusAuthorizationSource
          variant=$(jq -er '.mode | if . == "card_unlock" or . == "device_authorization" then . else error("Unsupported mode") end' "$root/source-config.json")
          bash "$root/$variant/build.sh"
          mkdir -p out
          cp "$root/$variant/build/iphoneos-arm64/"*.dylib out/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactPrefix || github.event.client_payload.artifactPrefix }}-${{ github.run_id }}
          path: out/*.dylib
          if-no-files-found: error
          retention-days: 7
